[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2excel-mapper"
version = "1.2.0"
description = "Interactive, integrity-first PDF table to Excel converter"
requires-python = ">=3.10"
dependencies = [
  "openpyxl>=3.1",
  "pdfplumber>=0.11",
  "pypdf>=5.0",
  "pytesseract>=0.3.10",
  "Pillow>=10",
  "numpy>=2.0",
  "rapidfuzz>=3.0",
]

[project.optional-dependencies]
ocr = []
gui = ["PySide6>=6.7"]
dev = ["pytest>=8", "pytest-qt>=4.4", "reportlab>=4"]
build = ["PyInstaller>=6.0"]

[project.scripts]
pdf2excel = "pdf2excel.cli:main"
pdf2excel-gui = "pdf2excel.gui:main"

[project.gui-scripts]
PDF2ExcelMapper = "pdf2excel.gui:main"

[tool.setuptools.packages.find]
include = ["pdf2excel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
